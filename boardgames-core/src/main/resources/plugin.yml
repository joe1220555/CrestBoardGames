name: CrestBoardGames
version: '${version}'
main: tw.crestnetwork.boardgames.core.CrestBoardGamesPlugin
api-version: '26.2'
author: Crest Network
description: Modular board game platform for Crest Network
depend: [Oraxen]
softdepend: [CrestCore, CrestNetworkBridge, PlaceholderAPI, Vault]
commands:
  boardgames:
    description: 開啟 Crest 桌遊大廳
    usage: /boardgames create <遊戲> | join [房號] | start | leave | rooms | modules
    aliases: [bg]
permissions:
  crestboardgames.use:
    default: true
  crestboardgames.admin:
    default: op
