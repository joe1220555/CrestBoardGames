name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew clean build
      - uses: actions/upload-artifact@v7
        with:
          name: CrestBoardGames
          path: |
            boardgames-core/build/libs/CrestBoardGames.jar
            modules/*/build/libs/Crest*.jar
